<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools - Art Portfolio</title>
    <link rel="icon" type="image/webp" href="/assets/pfp.webp">
    <link rel="stylesheet" href="../css/normalize.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/header_buttons.css">
    <link rel="stylesheet" href="../css/gallery.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ── Blender Extensions card grid ── */
        .ext-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .ext-card {
            background: hsl(213, 10%, 21%);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            border: 1px solid hsla(213, 10%, 80%, 0.15);
        }

        .ext-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 24px hsla(204, 100%, 50%, 0.2);
            border-color: hsla(204, 100%, 50%, 0.45);
        }

        .ext-card__thumbnail {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
        }

        .ext-card__body {
            padding: 0.83rem 0.95rem 0.95rem;
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 0.34rem;
        }

        .ext-card__type {
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: hsl(213, 10%, 58%);
        }

        .ext-card__title {
            font-size: 1.5rem;
            font-weight: 800;
            color: hsl(213, 10%, 98%);
            margin: 0;
            line-height: 1.3;
        }

        .ext-card__desc {
            font-size: 1.125rem;
            color: hsl(213, 10%, 80%);
            line-height: 1.45;
            margin: 0;
            flex: 1;
        }

        .ext-card__tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-top: 0.5rem;
        }

        .ext-card__tag {
            font-size: 0.75rem;
            font-weight: 400;
            padding: calc(.35em - 1px) 0.5em;
            border-radius: 0.4rem;
            border: 1px solid hsl(213, 10%, 48%);
            background-color: transparent;
            color: hsl(213, 10%, 58%);
            white-space: nowrap;
            line-height: 1;
        }

        .ext-card__author {
            font-size: 0.875rem;
            color: hsl(213, 10%, 58%);
            margin-top: 0.4rem;
        }

        .ext-card__footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 0.6rem;
        }

        .ext-card__rating {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.875rem;
            color: hsl(213, 10%, 58%);
        }

        /* Star bar — mimics Blender Extensions .stars */
        .ext-stars {
            display: inline-block;
            position: relative;
            font-size: 0.875rem;
            padding: 0.19rem 0.49rem;
            line-height: 1;
            /* empty stars */
            color: transparent;
            letter-spacing: 1px;
        }
        .ext-stars::before {
            content: '★★★★★';
            color: hsl(213, 10%, 35%);
        }
        .ext-stars__fill {
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            white-space: nowrap;
            color: hsl(42, 86%, 48%);
        }
        .ext-stars__fill::before {
            content: '★★★★★';
        }

        .ext-card__downloads {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.875rem;
            color: hsl(213, 10%, 58%);
        }

        .ext-source-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.7rem;
            color: hsl(213, 10%, 48%);
            margin-top: 1rem;
            text-decoration: none;
        }

        .ext-source-badge svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .ext-source-badge:hover {
            color: #009eff;
        }
    </style>
</head>
<body>
    <!-- Header placeholder -->
    <div id="header-placeholder"></div>

    <main>
        <div class="container">
            <div class="breadcrumb">
            </div>

            <section class="gallery">
                <h2>Tools</h2>

                <div class="ext-cards">

                    <!-- Display Quad Stars -->
                    <a class="ext-card"
                       href="https://extensions.blender.org/approval-queue/display-quad-stars/"
                       target="_blank"
                       rel="noopener noreferrer">
                        <img class="ext-card__thumbnail"
                             src="https://extensions.blender.org/media/thumbnails/c1/c16f9950d71a7114bb947cb66a1e17edcb4b01dba168ca8c91deb050c8fb4344_640x360.webp"
                             alt="Display Quad Stars thumbnail">
                        <div class="ext-card__body">
                            <span class="ext-card__type">Add-on</span>
                            <h3 class="ext-card__title">Display Quad Stars</h3>
                            <p class="ext-card__desc">Highlights quad stars on meshes</p>
                            <div class="ext-card__tags">
                                <span class="ext-card__tag">3D View</span>
                                <span class="ext-card__tag">Mesh</span>
                            </div>
                            <span class="ext-card__author">Zophiekat</span>
                            <div class="ext-card__footer">
                                <div class="ext-card__rating">
                                    <span class="ext-stars" title="0 out of 5">
                                        <span class="ext-stars__fill" style="width: 0%"></span>
                                    </span>
                                    <span>(0)</span>
                                </div>
                                <div class="ext-card__downloads">
                                    <i class="fa-solid fa-download" style="font-size:0.65rem"></i>
                                    0
                                </div>
                            </div>
                        </div>
                    </a>

                </div>

            </section>
        </div>
    </main>

    <!-- Footer placeholder -->
    <div id="footer-placeholder"></div>

    <script src="../js/main.js"></script>
</body>
</html>
