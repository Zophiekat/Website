<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools - Art Portfolio</title>
    <link rel="icon" type="image/webp" href="/assets/pfp.webp">
    <link rel="stylesheet" href="../css/normalize.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/header_buttons.css">
    <link rel="stylesheet" href="../css/gallery.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Header placeholder -->
    <div id="header-placeholder"></div>

    <main>
        <div class="container">
            <div class="breadcrumb">
            </div>

            <section class="gallery">
                <h2>Tools</h2>

                <div class="ext-cards">

                    <!-- Display Quad Stars -->
                    <a class="ext-card"
                       href="https://extensions.blender.org/approval-queue/display-quad-stars/"
                       target="_blank"
                       rel="noopener noreferrer">
                        <img class="ext-card__thumbnail"
                             src="https://extensions.blender.org/media/thumbnails/c1/c16f9950d71a7114bb947cb66a1e17edcb4b01dba168ca8c91deb050c8fb4344_640x360.webp"
                             alt="Display Quad Stars thumbnail">
                        <div class="ext-card__body">
                            <span class="ext-card__type">Add-on</span>
                            <h3 class="ext-card__title">Display Quad Stars</h3>
                            <p class="ext-card__desc">Highlights quad stars on meshes</p>
                            <div class="ext-card__tags">
                                <span class="ext-card__tag">3D View</span>
                                <span class="ext-card__tag">Mesh</span>
                            </div>
                            <span class="ext-card__author">Zophiekat</span>
                            <div class="ext-card__footer">
                                <div class="ext-card__rating">
                                    <span class="ext-stars" title="0 out of 5">
                                        <span class="ext-stars__fill" style="width: 0%"></span>
                                    </span>
                                    <span>(0)</span>
                                </div>
                                <div class="ext-card__downloads">
                                    <i class="fa-solid fa-download" style="font-size:0.65rem"></i>
                                    0
                                </div>
                            </div>
                        </div>
                    </a>

                </div>

            </section>
        </div>
    </main>

    <!-- Footer placeholder -->
    <div id="footer-placeholder"></div>

    <script src="../js/main.js"></script>
</body>
</html>
